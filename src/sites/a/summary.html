<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold summary | Orion Talkies fictional demo cinema</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="masthead">
    <span class="logo" aria-hidden="true"></span><strong>Orion Talkies</strong>
    <span class="demo-tag">Fictional demo cinema</span>
  </header>
  <main id="hold-summary">
    <div class="ticket">
      <div class="ticket-head">
        <p class="screen-name">The Paper Moon · Screen 2 · 7:30 PM</p>
        <h1 id="summary-title">Hold summary</h1>
        <p id="summary-message" role="status"></p>
      </div>
      <p id="summary-details"></p>
      <p class="ticket-foot"><a href="/">Return to the seat map</a></p>
    </div>
  </main>
</body>
</html>
